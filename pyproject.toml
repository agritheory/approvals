[project]
name = "approvals"
version = "16.0.0"
description = "Customizable Approval Workflows"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dynamic = [ "dependencies",]
[[project.authors]]
name = "AgriTheory"
email = "support@agritheory.dev"

[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.semantic_release]
version_toml = [ "pyproject.toml:project.version",]
version_variables = [ "approvals/__init__.py:__version__",]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.bench.dev-dependencies]
pytest = "~=8.2.2"
pytest-cov = "~=5.0.0"
pytest-order = "~=1.2.1"
pytest-playwright = "~=0.7.0"
playwright = "~=1.55.0"

[tool.pytest.ini_options]
addopts = "--cov=approvals --cov-report=term-missing"
testpaths = [ "approvals/tests",]

[tool.coverage.run]
source = [ "approvals",]
omit = [ "*/tests/*", "*/test_*.py",]

[tool.coverage.report]
show_missing = true

[tool.semantic_release.branches.version-16]
match = "^version-16$"

[tool.semantic_release.branches.version-15]
match = "^version-15$"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
pytest-order = "^1.3.0"
pytest-playwright = "^0.7.0"
playwright = "^1.55.0"
