name: Pytest CI

on:
  push:
    branches:
      - version-14
      - version-15
      - version-16
  pull_request:
    branches:
      - version-14
      - version-15
      - version-16
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BRANCH_NAME: ${{ github.base_ref || github.ref_name }}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    name: Tests
    env:
      BENCH_ROOT: /home/runner/frappe-bench

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: YES
          MYSQL_ROOT_PASSWORD: 'admin'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -padmin" --health-interval=5s --health-timeout=2s --health-retries=3

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: 'yarn'

      - name: Enable Yarn
        run: command -v yarn >/dev/null 2>&1 || npm install -g yarn

      - name: Add to Hosts
        if: ${{ !env.ACT }}
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install JS Dependencies
        run: yarn --prefer-offline

      - name: Install App Dependencies
        run: bash ${{ github.workspace }}/.github/helper/install_dependencies.sh

      - name: Install Bench Site and Apps
        env:
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PWD: 'admin'
          BRANCH_NAME: ${{ env.BRANCH_NAME}}
        run: |
          bash ${{ github.workspace }}/.github/helper/install.sh

      - name: Build Assets
        env:
          BENCH_ROOT: ${{ env.BENCH_ROOT }}
        run: |
          # bench refuses root; under act the step runs as root, so build as the bench user.
          if [[ "${ACT:-}" == "true" && "$(id -u)" -eq 0 ]]; then
            runuser -u ubuntu -- env HOME=/home/ubuntu PATH="${PATH}" bash -lc "cd '${BENCH_ROOT}' && bench build"
          else
            cd "${BENCH_ROOT}" && bench build
          fi

      - name: Run Tests
        env:
          BENCH_ROOT: ${{ env.BENCH_ROOT }}
        run: bash ${{ github.workspace }}/.github/helper/run_tests.sh

      - name: Pytest coverage comment
        if: ${{ !env.ACT }}
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ${{ env.BENCH_ROOT }}/apps/approvals/pytest-coverage.txt
          pytest-xml-coverage-path: ${{ env.BENCH_ROOT }}/apps/approvals/coverage.xml
